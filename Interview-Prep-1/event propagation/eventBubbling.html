<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="parent" style="padding: 50px; background-color: lightblue">
      Parent
      <button id="child" style="padding: 20px">Click me</button>
      <button id="child2" style="padding: 20px">Click me 2</button>
    </div>
  </body>
</html>
<script>
  document.getElementById("parent").addEventListener("click", function () {
    alert("parent clicked!");
  });
  document.getElementById("child").addEventListener("click", function (event) {
    alert("child clicked!");
    event.stopPropagation(); // it will prevent the event bubbling
  });
  document.getElementById("child2").addEventListener("click", function () {
    alert("child 2 clicked!");
  });
</script>
