<script>
  //   let arr = [1, 2, 3, [4, 5, 6, [10, 11, 12, [13, 14, 15]]], [7, 8, 9]];

  //   // [1,2,3,4,5,6,10,11,12,13,14,15,7,8,9] flattening an array.

  //   console.log(arr.flat(4));

  let arr = [1, [2, [3, 4]]];

  function flatten(arr) {
    let newArray = [];

    arr.forEach((element) => {
      if (Array.isArray(element)) {
        newArray = newArray.concat(flatten(element));
      } else {
        newArray.push(element);
      }
    });

    return newArray;
  }

  console.log(flatten(arr));
</script>
